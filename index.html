<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guessing Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f6d365, #fda085);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .game-box {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 420px;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            color: #333;
        }

        label {
            display: block;
            margin: 12px 0 8px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        button {
            background: #ff7f50;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
        }

        button:hover {
            background: #ff6a3d;
        }

        #message {
            margin-top: 15px;
            font-size: 18px;
            color: #222;
            min-height: 28px;
        }
    </style>
</head>
<body>
    <div class="game-box">
        <h1>Guessing Game</h1>

        <label for="maxNumber">Enter maximum number:</label>
        <input id="maxNumber" type="number" min="2" value="10">
        <button id="startBtn">Start Game</button>

        <div id="guessSection" style="display:none;">
            <label for="guessInput">Enter your guess:</label>
            <input id="guessInput" type="number" min="1">
            <button id="guessBtn">Guess</button>
            <button id="quitBtn" style="background:#555;">Quit</button>
        </div>

        <p id="message"></p>
    </div>

    <script src="first.js"></script>
</body>
</html>
